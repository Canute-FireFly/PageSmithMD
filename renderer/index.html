<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src file: https:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageSmithMD</title>
  <link rel="stylesheet" href="vendor/hljs-light.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="vendor/hljs-dark.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="vendor/katex.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-read">
  <nav id="menubar" role="menubar" aria-label="Menu"></nav>
  <div id="tabs" role="tablist"></div>
  <nav id="format-bar" aria-label="Formatting">
    <div id="fmt-tools"></div>
    <div class="seg" role="group" aria-label="Read or edit">
      <button type="button" data-mode="read" title="Read-only (Ctrl+1)">Read</button>
      <button type="button" data-mode="edit" title="Edit in the page (Ctrl+2). Split view: View menu (Ctrl+3)">Edit</button>
    </div>
  </nav>
  <div id="find-bar" hidden role="search">
    <div class="find-row">
      <input id="find-input" type="text" placeholder="Find" autocomplete="off" spellcheck="false" aria-label="Find">
      <span id="find-count" aria-live="polite"></span>
      <button type="button" id="find-case" class="toggle" title="Match case" aria-pressed="false">Aa</button>
      <button type="button" id="find-word" class="toggle" title="Whole word" aria-pressed="false"><u>ab</u></button>
      <button type="button" id="find-prev" title="Previous match (Shift+Enter)">&#8593;</button>
      <button type="button" id="find-next" title="Next match (Enter)">&#8595;</button>
      <button type="button" id="find-toggle-replace" title="Show replace (Ctrl+H)">Replace</button>
      <button type="button" id="find-close" title="Close (Esc)">&times;</button>
    </div>
    <div class="find-row" id="replace-row" hidden>
      <input id="replace-input" type="text" placeholder="Replace with" autocomplete="off" spellcheck="false" aria-label="Replace with">
      <button type="button" id="replace-one" title="Replace this match (Enter)">Replace</button>
      <button type="button" id="replace-all" title="Replace every match">Replace all</button>
      <span id="replace-note"></span>
    </div>
  </div>
  <div id="workspace">
  <aside id="sidebar" aria-label="Sidebar">
    <section class="sb-section sb-outline">
      <h2 class="sb-title">Outline</h2>
      <nav id="outline" aria-label="Document outline"></nav>
    </section>
    <section class="sb-section sb-recent">
      <h2 class="sb-title">Recent files</h2>
      <ul id="recent"></ul>
    </section>
  </aside>
  <button type="button" id="sb-toggle" title="Hide sidebar (Ctrl+Shift+L)" aria-label="Hide sidebar"></button>
  <main id="panes">
    <section id="editor-pane">
      <textarea id="editor" spellcheck="false" placeholder="Markdown source…"></textarea>
    </section>
    <section id="preview-pane">
      <article id="preview" class="markdown-body" spellcheck="true"></article>
    </section>
  </main>
  </div>
  <footer id="status"><span id="stats"></span><span class="status-right"><span id="saved"></span><button type="button" id="theme-btn"></button></span></footer>

  <dialog id="dlg">
    <form method="dialog" id="dlg-form">
      <label id="dlg-label" for="dlg-input"></label>
      <input id="dlg-input" type="text" autocomplete="off">
      <label id="dlg-label2" for="dlg-input2"></label>
      <input id="dlg-input2" type="text" autocomplete="off">
      <div class="dlg-buttons">
        <button type="button" id="dlg-extra" hidden></button>
        <button type="button" id="dlg-cancel">Cancel</button>
        <button type="submit" id="dlg-ok">OK</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/marked.js"></script>
  <script src="vendor/purify.js"></script>
  <script src="vendor/highlight.js"></script>
  <script src="vendor/turndown.js"></script>
  <script src="vendor/turndown-gfm.js"></script>
  <script src="vendor/katex.js"></script>
  <script src="app.js"></script>
</body>
</html>
