# Builds PageSmithMD on Windows when a version tag (v1.2.3) is pushed, and uploads the Setup .exe,
# the portable .zip and the update files to a DRAFT GitHub release. Nothing is public until a
# maintainer checks the draft and presses Publish.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: # run by hand from the Actions tab (builds and uploads the files as a workflow artifact only)

permissions:
  contents: write # create the draft release and upload files

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match package.json version $version. Update package.json (and CHANGELOG.md) first."
            exit 1
          }

      - name: Build and upload to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/dist.js --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/dist.js

      - name: Keep the built files with the run
        uses: actions/upload-artifact@v4
        with:
          name: PageSmithMD-windows
          path: |
            release/installer/*.exe
            release/installer/*.zip
            release/installer/*.yml
            release/installer/*.blockmap
          if-no-files-found: error
